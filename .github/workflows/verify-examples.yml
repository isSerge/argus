name: Verify Examples

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-examples-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo builds
        uses: Swatinem/rust-cache@v2

      - name: Build binaries
        run: cargo build --workspace --release

      - name: Run examples
        env:
          # Keyed archive-capable RPC endpoints (comma-separated lists work).
          RPC_URL_ETHEREUM: ${{ secrets.RPC_URL_ETHEREUM }}
          RPC_URL_BASE: ${{ secrets.RPC_URL_BASE }}
          RPC_URL_BNB_SMART_CHAIN: ${{ secrets.RPC_URL_BNB_SMART_CHAIN }}
          RPC_URL_ROBINHOOD_CHAIN: ${{ secrets.RPC_URL_ROBINHOOD_CHAIN }}
        run: |
          chmod +x ./run_examples.sh
          ./run_examples.sh
