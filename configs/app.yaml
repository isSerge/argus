database_url: "sqlite:data/monitor.db"
rpc_urls:
  - "https://1rpc.io/eth"
  - "https://rpc.mevblocker.io"
  - "https://eth.llamarpc.com"
network_id: "ethereum"

# Controls where Argus starts on a fresh database.
# Can be a block number, 'latest', or a negative offset from the head.
initial_start_block: -100

block_chunk_size: 100
log_chunk_size: 2000
concurrency: 8
polling_interval_ms: 10000
# Expected block time of the target chain in milliseconds.
# This value is used to estimate the expected time between new blocks on the target chain.
expected_block_time_ms: 12000
# Required. Reorg-safety depth: blocks to wait before processing
# (head - confirmation_blocks). The right value is chain-specific: 12 is
# ~2.4 min on Ethereum but only ~36s on BSC and ~24s on Polygon. See the
# per-chain recommended-values table in docs/src/user_guide/app_yaml.md.
confirmation_blocks: 12
notification_channel_capacity: 1024
abi_config_path: abis/

# Optional: Configuration for the RPC retry policy.
# If this section is omitted, default values will be used.
retry_config:
  # The maximum number of retries for a request.
  max_retry: 10
  # The initial backoff delay in milliseconds.
  backoff_ms: 1000
  # The number of compute units per second to allow (for rate limiting).
  compute_units_per_second: 100

# Optional: Configuration for graceful shutdown timeout.
# If this section is omitted, the default value of 30 seconds will be used.
shutdown_timeout_secs: 30

# API server configuration
server:
  # Address and port for the HTTP server to listen on.
  listen_address: "0.0.0.0:8080"
  # API key for securing write endpoints (alternatively set ARGUS_API_KEY env var)
  # api_key: "your-secret-api-key-here"
