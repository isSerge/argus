database_url: "sqlite:data/monitor.db"

# Base is a 2s-block OP-stack rollup. The dRPC public endpoint is the
# default because it serves archive-depth blocks/logs with consistent
# behavior (bloXroute's gateway rejects ranges from datacenter IPs such as
# CI, publicnode only keeps a short recent window and mainnet.base.org
# rate-limits `eth_getLogs`). Override with RPC_URL_BASE (e.g. an Alchemy
# keyed endpoint) for CI or personal use.
rpc_urls:
  - "${RPC_URL_BASE:-https://base.drpc.org}"

network_id: "base"
abi_config_path: abis/

# Start close to the tip on fast chains: catch-up from `latest - 200`
# (~7 min of chain time) exercises drain-to-head without a long backfill.
initial_start_block: -200

# Fast-chain tuning (Base = 2s blocks):
# - expected_block_time_ms makes live polling track the chain (~1-block latency)
#   and lets the block-time calibrator warn if the setting drifts from reality.
# - polling_interval_ms acts as the ceiling for the adaptive interval.
# - block_chunk_size 10 keeps batches ~20s of chain time.
# - log_chunk_size 10 matches the strictest provider cap (Alchemy
#   free-tier eth_getLogs ranges are limited to 10 blocks).
# - confirmation_blocks 15 ≈ 30s on Base (see docs confirmation-depth table).
block_chunk_size: 10
log_chunk_size: 10
polling_interval_ms: 2000
expected_block_time_ms: 2000
confirmation_blocks: 15

notification_channel_capacity: 1024
